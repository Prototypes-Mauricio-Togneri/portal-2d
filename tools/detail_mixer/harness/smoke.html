<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mixer engine smoke test</title>
<style>
  body { margin: 0; padding: 10px; background: rgba(32, 32, 32, 1); color: rgba(220, 220, 220, 1); font: 13px sans-serif; display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; }
  figcaption { padding: 4px 0; max-width: 560px; }
  canvas { display: block; }
  pre { flex-basis: 100%; margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- Proves the engine and each of its hooks work. Open after ./build.sh:
     harness/shot.sh 'harness/smoke.html' build/smoke.png 1900 1500 -->
<script src="../build/engine.js"></script>
<script>
const Engine = window.ChamberEngine
const query = new URLSearchParams(location.search)
const chamber = Number(query.get('c') ?? 1)
const tile = Number(query.get('t') ?? 45)

function show(caption, options) {
  const canvas = document.createElement('canvas')
  Engine.render(canvas, chamber, tile, options)
  const figure = document.createElement('figure')
  const text = document.createElement('figcaption')
  text.textContent = caption
  figure.append(canvas, text)
  document.body.append(figure)
}

// A number from 0 to 1 that depends only on a tile and a salt
function tileNumber(x, y, salt) {
  let h = Math.imul(x + 1, 0x9E3779B1) ^ Math.imul(y + 1, 0x85EBCA6B) ^ Math.imul(salt + 1, 0xC2B2AE35)
  h = Math.imul(h ^ (h >>> 16), 0x7FEB352D)
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B)
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296
}

// The 'skin' hook: a copy of the sprite with something drawn only where the sprite already is,
// kept so each is made once. Loud on purpose here, so the smoke test is easy to read.
const skins = new Map()

function demoSkin(sprite) {
  if (!['box', 'box_mirror', 'button_up', 'button_pressed', 'switch', 'arrow', 'turntable', 'turntable_arrow', 'ditch_bridged'].includes(sprite.name)) {
    return null
  }

  const key = `${sprite.name}:${sprite.tileSize}:${sprite.x},${sprite.y}`
  let skin = skins.get(key)

  if (skin === undefined) {
    skin = document.createElement('canvas')
    skin.width = sprite.image.width
    skin.height = sprite.image.height
    const ctx = skin.getContext('2d')
    ctx.drawImage(sprite.image, 0, 0)
    // Only where the sprite is already painted, so its shape, and so its shadow, stay the same
    ctx.globalCompositeOperation = 'source-atop'
    ctx.fillStyle = `rgba(0, 0, 0, ${0.35 * tileNumber(sprite.x, sprite.y, 1)})`
    ctx.fillRect(0, 0, skin.width, skin.height)
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'
    ctx.lineWidth = Math.max(1, sprite.tileSize * 0.03)
    ctx.beginPath()
    ctx.moveTo(skin.width * tileNumber(sprite.x, sprite.y, 2), 0)
    ctx.lineTo(skin.width * tileNumber(sprite.x, sprite.y, 3), skin.height)
    ctx.stroke()
    skins.set(key, skin)
  }

  return skin
}

// The 'afterTile' hook: drawn over a joined tile in a frame on its top left corner
function demoAfterTile(tile) {
  if (tile.name !== 'ditch') {
    return
  }

  tile.ctx.strokeStyle = 'rgba(255, 220, 120, 0.9)'
  tile.ctx.lineWidth = Math.max(1, tile.tileSize * 0.05)
  tile.ctx.strokeRect(tile.tileSize * 0.3, tile.tileSize * 0.3, tile.tileSize * 0.4, tile.tileSize * 0.4)
}

Engine.ready.then(() => {
  const listing = Engine.chambers[chamber]
  const middle = Math.floor(listing.steps / 2)

  show('1. As the game draws it now (surface detail on)', {})
  show('2. surfaceDetail: false, the floor and walls as they were before', {surfaceDetail: false})
  show('3. skin hook (boxes, buttons, switches, arrows, bridged ditches) and afterTile hook (open ditches), loud on purpose', {hooks: {skin: demoSkin, afterTile: demoAfterTile}})
  show(`4. step ${middle} of ${listing.steps} of the recorded solution, with the same hooks`, {step: middle, hooks: {skin: demoSkin, afterTile: demoAfterTile}})
  show('5. floor and walls hooks: a red line over the floor, a green one over the walls', {hooks: {
    floor: (ctx, tileSize) => { ctx.fillStyle = 'rgba(255, 0, 0, 0.5)'; ctx.fillRect(0, tileSize * 4.4, tileSize * listing.width, tileSize * 0.2) },
    walls: (ctx, tileSize) => { ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = 'rgba(0, 255, 0, 0.5)'; ctx.fillRect(0, tileSize * 6.4, tileSize * listing.width, tileSize * 0.2) },
  }})

  const now = Engine.instances(chamber, middle)
  const summary = document.createElement('pre')
  const counts = {}
  for (const element of now.elements) {
    counts[element.kind] = (counts[element.kind] ?? 0) + 1
  }
  summary.textContent = `${listing.name}: ${listing.width} x ${listing.height}, ${listing.steps} recorded actions\n`
    + `elements: ${JSON.stringify(counts)}\n`
    + `at step ${middle}: subject ${JSON.stringify(now.subject)}\n`
    + `boxes: ${JSON.stringify(now.boxes)}\n`
    + `buttons: ${JSON.stringify(now.elements.filter((element) => element.kind === 'button').map((element) => [element.index, element.x, element.row, element.pressed]))}\n`
    + `ditches: ${JSON.stringify(now.elements.filter((element) => element.kind === 'ditch').map((element) => [element.index, element.x, element.row, element.linked, element.blocked]))}`
  document.body.append(summary)
}).catch((error) => {
  document.body.textContent = String((error && error.stack) || error)
})
</script>
</body>
</html>
