<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Game against mock-up</title>
<style>
  body { margin: 0; padding: 10px; background: rgba(32, 32, 32, 1); color: rgba(220, 220, 220, 1); font: 13px sans-serif; }
  figure { margin: 0 0 8px; }
  canvas { display: block; }
</style>
</head>
<body>
<!-- The game's element detail as built (engine=game, build/engine.js) or the mock-up of the chosen settings
     (engine=mockup, build/engine_mockup.js, kept from before the build), drawn the same way, to compare crop by crop:
     harness/shot.sh 'elements/compare.html?engine=game&t=110' build/compare_game.png 900 3000 -->
<img src="/wait?ms=5000" alt="" hidden>
<script>
const query = new URLSearchParams(location.search)
const mockup = query.get('engine') === 'mockup'
document.write(`<script src="../build/${mockup ? 'engine_mockup' : 'engine'}.js"><\/script><script src="config.js"><\/script><script src="effects.js"><\/script>`)
</script>
<script>
const CHOSEN = {"seed":2529,"on":["box.light","mirror.tone","mirror.light","button.tone","button.light","switch.tone","switch.light","arrow.tone","arrow.light","turntable.tone","turntable.light","pit.tone","grate.tone","grate.light","grate.worn","grate.scratches"],"amount":{"box.light":50,"mirror.tone":100,"mirror.light":50,"button.tone":50,"button.light":50,"switch.tone":50,"switch.light":50,"arrow.tone":100,"arrow.light":50,"turntable.tone":50,"turntable.light":50,"pit.tone":100,"grate.tone":100,"grate.light":50,"grate.worn":20,"grate.scratches":50},"share":{"grate.worn":100,"grate.scratches":100},"choices":{"carried":"worn","destroyed":"same","floorWear":"off","boxLight":"start","alike":"own"},"pool":6}
const settings = baseSettings()
settings.seed = CHOSEN.seed
for (const key of CHOSEN.on) { settings.on[key] = true; settings.amount[key] = CHOSEN.amount[key]; if (CHOSEN.share[key] !== undefined) settings.share[key] = CHOSEN.share[key] }
Object.assign(settings.choices, CHOSEN.choices)
const tile = Number(query.get('t') ?? 110)
const count = Number(query.get('n') ?? 5)
const ROWS = {box: [2], box_mirror: [2], button: [2, 4], switch: [2], arrow: [2], turntable: [2], ditch: [2, 4]}
Engine.ready.then(() => {
  const chosen = mockup ? settings : null
  for (const [board, rows] of Object.entries(ROWS)) {
    const index = Engine.chambers.findIndex((chamber) => chamber.board === board)
    const full = document.createElement('canvas')
    drawChamber(full, index, tile, chosen)
    const canvas = document.createElement('canvas')
    canvas.width = count * tile
    canvas.height = rows.length * tile
    rows.forEach((row, i) => canvas.getContext('2d').drawImage(full, tile, row * tile, count * tile, tile, 0, i * tile, count * tile, tile))
    const figure = document.createElement('figure')
    figure.append(`${board} (${mockup ? 'mock-up' : 'game'})`, canvas)
    document.body.append(figure)
  }
}).catch((error) => { document.body.textContent = String(error.stack || error) })
</script>
</body>
</html>
