<!doctype html>
<html><head><meta charset="utf-8"><title>Timing the chosen look</title></head>
<body>
<!-- Times the mock-up drawing a chamber with the author's chosen settings, on the real clock:
     google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom 'http://127.0.0.1:8765/elements/time_choice.html' -->
<img src="/wait?ms=9000" alt="" hidden>
<pre id="out">running</pre>
<script src="../build/engine.js"></script>
<script src="config.js"></script>
<script src="effects.js"></script>
<script>
const CHOSEN = {"seed":2529,"on":["box.light","mirror.tone","mirror.light","button.tone","button.light","switch.tone","switch.light","arrow.tone","arrow.light","turntable.tone","turntable.light","pit.tone","grate.tone","grate.light","grate.worn","grate.scratches"],"amount":{"box.light":50,"mirror.tone":100,"mirror.light":50,"button.tone":50,"button.light":50,"switch.tone":50,"switch.light":50,"arrow.tone":100,"arrow.light":50,"turntable.tone":50,"turntable.light":50,"pit.tone":100,"grate.tone":100,"grate.light":50,"grate.worn":20,"grate.scratches":50},"share":{"grate.worn":100,"grate.scratches":100},"choices":{"carried":"worn","destroyed":"same","floorWear":"off","boxLight":"start","alike":"own"},"pool":6}
const settings = baseSettings()
settings.seed = CHOSEN.seed
for (const key of CHOSEN.on) { settings.on[key] = true; settings.amount[key] = CHOSEN.amount[key]; if (CHOSEN.share[key] !== undefined) settings.share[key] = CHOSEN.share[key] }
Object.assign(settings.choices, CHOSEN.choices)
const median = (values) => values.slice().sort((a, b) => a - b)[Math.floor(values.length / 2)]
Engine.ready.then(() => {
  const lines = []
  for (const [index, tile] of [[3, 59], [1, 50], [10, 63]]) {
    const canvas = document.createElement('canvas')
    const time = (chosen) => { const start = performance.now(); drawChamber(canvas, index, tile, chosen); return performance.now() - start }
    time(null)
    const plain = []
    for (let i = 0; i < 7; i++) plain.push(time(null))
    skins.clear()
    const first = time(settings)
    const again = []
    for (let i = 0; i < 7; i++) again.push(time(settings))
    lines.push(`${Engine.chambers[index].name} at ${tile} px: original ${median(plain).toFixed(1)} ms; with the choice, first ${first.toFixed(1)} ms (skins made), then ${median(again).toFixed(1)} ms (median of 7)`)
  }
  document.getElementById('out').textContent = lines.join('\n')
}).catch((error) => { document.getElementById('out').textContent = String(error.stack || error) })
</script>
</body></html>
