<!doctype html><html><body><pre id="out">running</pre><img src="/slow" alt="">
<script src="/dist/engine.js"></script><script src="/config.js"></script><script src="/effects.js"></script>
<script>
Engine.ready.then(() => {
  const lines = []
  const info = chamberInfo(1)
  const layer = softLayer(info, (u, v, d, out) => { out[0] = 34; out[1] = 40; out[2] = 60; out[3] = 0.14 * clouds(1, u / 4.2, v / 4.2, 21) })
  for (const size of [900, 1800]) {
    for (const quality of ['high', 'medium', 'low']) {
      const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size
      const ctx = canvas.getContext('2d'); ctx.fillStyle = 'rgb(239,241,248)'; ctx.fillRect(0, 0, size, size)
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = quality
      const runs = 10; const t0 = performance.now()
      for (let i = 0; i < runs; i++) { ctx.drawImage(layer, 0, 0, size, size) }
      ctx.getImageData(0, 0, 1, 1)
      lines.push(`stretch ${layer.width}px layer to ${size}px, ${quality}: ${((performance.now() - t0) / runs).toFixed(1)} ms`)
    }
  }
  // Distance to walls by two sweeps over the samples instead of searching round each one
  const W = info.W * SUB, H = info.H * SUB
  const t0 = performance.now()
  for (let run = 0; run < 10; run++) {
    const d = new Float32Array(W * H).fill(1e9)
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) if (info.wall(Math.floor(i / SUB), Math.floor(j / SUB))) d[(j * W) + i] = 0
    const pass = (i, j, di, dj, cost) => { const x = i + di, y = j + dj; if (x >= 0 && y >= 0 && x < W && y < H) { const v = d[(y * W) + x] + cost; if (v < d[(j * W) + i]) d[(j * W) + i] = v } }
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { pass(i, j, -1, 0, 1); pass(i, j, 0, -1, 1); pass(i, j, -1, -1, 1.4142); pass(i, j, 1, -1, 1.4142) }
    for (let j = H - 1; j >= 0; j--) for (let i = W - 1; i >= 0; i--) { pass(i, j, 1, 0, 1); pass(i, j, 0, 1, 1); pass(i, j, 1, 1, 1.4142); pass(i, j, -1, 1, 1.4142) }
  }
  lines.push(`distance to walls by two sweeps: ${((performance.now() - t0) / 10).toFixed(1)} ms`)
  document.getElementById('out').textContent = lines.join('\n')
})
</script></body></html>
