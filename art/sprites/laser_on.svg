<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A laser beam that is on (docs/sprites.md), as in the mockup: drawn left to
    right through the tile's middle, its square ends on both edges, so
    neighbouring laser tiles make one beam. A wide red haze tinting the floor,
    then a saturated crimson beam about 30 px across, lighter towards a
    white-hot core. The game turns it a quarter turn for a vertical laser.
  -->
  <defs>
    <!-- The haze around the beam, fading out above and below it -->
    <linearGradient id="haze" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="176">
      <stop offset="0" stop-color="rgb(235, 30, 55)" stop-opacity="0"/>
      <stop offset="0.15" stop-color="rgb(235, 30, 55)" stop-opacity="0.08"/>
      <stop offset="0.3" stop-color="rgb(235, 30, 55)" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="rgb(235, 30, 55)" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="rgb(235, 30, 55)" stop-opacity="0.24"/>
      <stop offset="0.85" stop-color="rgb(235, 30, 55)" stop-opacity="0.08"/>
      <stop offset="1" stop-color="rgb(235, 30, 55)" stop-opacity="0"/>
    </linearGradient>

    <!-- The beam: saturated crimson at its edges, lighter inwards, white at its core -->
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="0" y1="113" x2="0" y2="143">
      <stop offset="0" stop-color="rgb(222, 16, 44)"/>
      <stop offset="0.25" stop-color="rgb(240, 62, 74)"/>
      <stop offset="0.38" stop-color="rgb(255, 208, 204)"/>
      <stop offset="0.44" stop-color="rgb(255, 249, 246)"/>
      <stop offset="0.56" stop-color="rgb(255, 249, 246)"/>
      <stop offset="0.62" stop-color="rgb(255, 208, 204)"/>
      <stop offset="0.75" stop-color="rgb(240, 62, 74)"/>
      <stop offset="1" stop-color="rgb(222, 16, 44)"/>
    </linearGradient>
  </defs>

  <!-- Haze -->
  <rect x="0" y="80" width="256" height="96" fill="url(#haze)"/>

  <!-- Beam, with its soft edges -->
  <rect x="0" y="111" width="256" height="34" fill="rgb(222, 16, 44)" opacity="0.45"/>
  <rect x="0" y="113" width="256" height="30" fill="url(#beam)"/>
</svg>
