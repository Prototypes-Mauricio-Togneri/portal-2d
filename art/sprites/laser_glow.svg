<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!--
    The laser's glow (docs/sprites.md, glow): red light only, added over
    everything. Its tile is the centred 256 px square. The band of light runs
    along the beam (y = 192), fading smoothly to nothing about 80 px above and
    below, and spans exactly the tile's width, with nothing in the side
    margins, so the glows of neighbouring laser tiles meet without adding up.
  -->
  <defs>
    <!-- A bell-shaped falloff above and below the beam -->
    <linearGradient id="falloff" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="272">
      <stop offset="0" stop-color="rgb(235, 30, 55)" stop-opacity="0"/>
      <stop offset="0.15" stop-color="rgb(235, 30, 55)" stop-opacity="0.03"/>
      <stop offset="0.3" stop-color="rgb(235, 30, 55)" stop-opacity="0.12"/>
      <stop offset="0.4" stop-color="rgb(235, 30, 55)" stop-opacity="0.3"/>
      <stop offset="0.46" stop-color="rgb(235, 30, 55)" stop-opacity="0.47"/>
      <stop offset="0.5" stop-color="rgb(235, 30, 55)" stop-opacity="0.55"/>
      <stop offset="0.54" stop-color="rgb(235, 30, 55)" stop-opacity="0.47"/>
      <stop offset="0.6" stop-color="rgb(235, 30, 55)" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="rgb(235, 30, 55)" stop-opacity="0.12"/>
      <stop offset="0.85" stop-color="rgb(235, 30, 55)" stop-opacity="0.03"/>
      <stop offset="1" stop-color="rgb(235, 30, 55)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="112" width="256" height="160" fill="url(#falloff)"/>
</svg>
