<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 140 140">
  <!--
    The floor button, pressed (docs/sprites.md): the same as button_up.svg,
    its dome lit up in the game's caution red. A box on it is drawn as on the
    floor, wider than the dome's red, so only the plate and the clamps stay
    in sight around it.
    Drawn on a 140-unit grid, lit from overhead, so it is the same on every
    side.
  -->

  <!-- The whole button, scaled to 85 % round the tile's middle -->
  <g transform="translate(70 70) scale(0.85) translate(-70 -70)">
    <!-- The plate -->
    <circle cx="70" cy="70" r="68.2" fill="rgb(250, 250, 250)" stroke="rgb(60, 60, 60)" stroke-width="3.6"/>

    <!-- The dome, in the caution red -->
    <circle cx="70" cy="70" r="46.084" fill="rgb(220, 60, 50)" stroke="rgb(110, 26, 22)" stroke-width="4.2"/>

    <!-- The four corner clamps, each pointing at the dome -->
    <g fill="rgb(64, 88, 86)" stroke="rgb(41, 57, 66)" stroke-width="2.05">
      <polygon points="20.589,41.55 42.889,18.359 15.869,1.439 1.449,15.288"/>
      <polygon points="119.26,41.24 96.96,18.038 123.98,1.118 138.4,14.968"/>
      <polygon points="119.35,98.68 97.05,121.88 124.07,138.8 138.49,124.95"/>
      <polygon points="20.482,98.57 42.787,121.77 15.768,138.69 1.347,124.84"/>
    </g>
  </g>
</svg>
