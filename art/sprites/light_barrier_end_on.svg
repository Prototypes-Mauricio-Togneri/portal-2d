<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A light barrier's connector while it is on (docs/sprites.md): a dark
    steel plate on the tile's left edge, centred on the band and a little
    taller than it, with a teal slot as long as the band the light leaves
    from. Drawn at the left end of a band running left to right; the game
    turns it to each end of each run of light barriers. It must match
    light_barrier_end_off but for the slot, since the game draws one over
    the other.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- The plate, its far side past the tile's edge, so only its inner corners are rounded -->
    <rect x="-4" y="68" width="32" height="120" rx="3" fill="rgb(50, 55, 61)" stroke="rgb(176, 183, 189)" stroke-width="2.5"/>

    <!-- The slot -->
    <rect x="20" y="83" width="7" height="90" rx="1" fill="rgb(96, 222, 186)"/>
  </g>
</svg>
