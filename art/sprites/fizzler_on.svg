<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A fizzler that is on (docs/sprites.md), drawn for a gap in a wall running
    left to right: an emitter post at each side, its slit lit, and between
    them a see-through lavender-white field crossed by soft ripples. It is
    drawn over everything, so the field stays faint. The left post is drawn
    once and turned to the right. The game turns it when the gap runs the
    other way, and makes it shimmer.
  -->
  <defs>
    <!-- A post's face: dark at its outer side, lit at the edge facing the field -->
    <linearGradient id="postFace" gradientUnits="userSpaceOnUse" x1="3" y1="0" x2="23" y2="0">
      <stop offset="0" stop-color="rgb(58, 61, 66)"/>
      <stop offset="1" stop-color="rgb(96, 100, 107)"/>
    </linearGradient>

    <!-- The field: brightest by the emitters, faintest in the middle -->
    <linearGradient id="field" gradientUnits="userSpaceOnUse" x1="26" y1="0" x2="230" y2="0">
      <stop offset="0" stop-color="rgb(215, 200, 250)" stop-opacity="0.42"/>
      <stop offset="0.25" stop-color="rgb(215, 200, 250)" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="rgb(215, 200, 250)" stop-opacity="0.18"/>
      <stop offset="0.75" stop-color="rgb(215, 200, 250)" stop-opacity="0.24"/>
      <stop offset="1" stop-color="rgb(215, 200, 250)" stop-opacity="0.42"/>
    </linearGradient>

    <!-- The soft light around the slits and the ripples -->
    <filter id="glow" x="-1" y="-0.2" width="3" height="1.4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="soften" x="-0.1" y="-1" width="1.2" height="3" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="gap">
      <rect x="26" y="0" width="204" height="256"/>
    </clipPath>

    <!-- The left emitter post, its slit facing the field -->
    <g id="post">
      <rect x="0" y="0" width="26" height="256" fill="rgb(34, 36, 40)"/>
      <rect x="3" y="3" width="20" height="250" fill="url(#postFace)"/>
      <rect x="15" y="16" width="9" height="224" rx="4" fill="rgb(215, 200, 250)" filter="url(#glow)"/>
      <rect x="17" y="18" width="4" height="220" rx="2" fill="rgb(240, 232, 255)"/>
    </g>

    <!-- The ripples, running along the field -->
    <g id="ripples" fill="none" stroke-linecap="round">
      <path d="M 26 50 q 12.75 -7 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0"/>
      <path d="M 26 102 q 12.75 7 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0"/>
      <path d="M 26 154 q 12.75 -7 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0"/>
      <path d="M 26 206 q 12.75 7 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0 t 25.5 0"/>
    </g>
  </defs>

  <!-- The field and its ripples -->
  <rect x="26" y="0" width="204" height="256" fill="url(#field)"/>
  <g clip-path="url(#gap)">
    <use href="#ripples" stroke="rgb(245, 240, 255)" stroke-width="7" opacity="0.4" filter="url(#soften)"/>
    <use href="#ripples" stroke="rgb(245, 240, 255)" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- The emitter posts -->
  <use href="#post"/>
  <use href="#post" transform="rotate(180 128 128)"/>
</svg>
