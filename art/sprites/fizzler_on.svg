<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A fizzler that is on (docs/sprites.md), drawn for a gap in a wall running
    left to right, as in the mockup: a steel-blue field filling the tile,
    still see-through, with bright edge lines along the floor on either side,
    two soft waves crossing it from wall to wall and a few sparkles. Each
    wave is one full period across the tile, so neighbouring fizzlers join.
    The game turns it when the gap runs the other way, and makes it shimmer.
  -->
  <defs>
    <!-- The soft light around the edge lines, the waves and the sparkles -->
    <filter id="glow" x="-0.2" y="-0.2" width="1.4" height="1.4" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256"/>
    </clipPath>

    <!-- The two main waves, in opposite phase, and a faint one between them -->
    <g id="waves" fill="none" stroke-linecap="round">
      <path d="M 0 78 q 64 -36 128 0 t 128 0"/>
      <path d="M 0 178 q 64 36 128 0 t 128 0"/>
    </g>
    <path id="faintWave" d="M 0 128 q 64 -22 128 0 t 128 0" fill="none"/>

    <!-- One sparkle: a bright dot in its own glow -->
    <g id="sparkle">
      <circle cx="0" cy="0" r="9" fill="rgb(200, 220, 255)" opacity="0.7" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="3.5" fill="rgb(255, 255, 255)"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <!-- The field -->
    <rect x="0" y="0" width="256" height="256" fill="rgb(48, 76, 140)" opacity="0.62"/>

    <!-- The waves: a wide soft glow under a fine bright line -->
    <use href="#waves" stroke="rgb(160, 190, 245)" stroke-width="12" opacity="0.35" filter="url(#glow)"/>
    <use href="#waves" stroke="rgb(196, 216, 255)" stroke-width="3" opacity="0.85"/>
    <use href="#faintWave" stroke="rgb(170, 195, 240)" stroke-width="2" opacity="0.4"/>

    <!-- The edge lines along the floor on either side, and fainter ones along the walls -->
    <g fill="rgb(200, 222, 255)">
      <rect x="0" y="2" width="256" height="8" opacity="0.6" filter="url(#glow)"/>
      <rect x="0" y="246" width="256" height="8" opacity="0.6" filter="url(#glow)"/>
      <rect x="0" y="4" width="256" height="4"/>
      <rect x="0" y="248" width="256" height="4"/>
      <rect x="0" y="0" width="6" height="256" opacity="0.4" filter="url(#glow)"/>
      <rect x="250" y="0" width="6" height="256" opacity="0.4" filter="url(#glow)"/>
      <rect x="0" y="0" width="4" height="256" opacity="0.8"/>
      <rect x="252" y="0" width="4" height="256" opacity="0.8"/>
    </g>

    <!-- Sparkles -->
    <use href="#sparkle" transform="translate(50 112)"/>
    <use href="#sparkle" transform="translate(214 118)"/>
    <use href="#sparkle" transform="translate(128 6)"/>
    <use href="#sparkle" transform="translate(128 250)"/>
    <use href="#sparkle" transform="translate(206 46) scale(0.7)"/>
    <use href="#sparkle" transform="translate(56 214) scale(0.7)"/>
  </g>
</svg>
