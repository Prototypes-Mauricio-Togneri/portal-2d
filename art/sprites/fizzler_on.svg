<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A fizzler that is on (docs/sprites.md): a fine mesh of lavender
    hexagons, glowing, over a faint tint, strongest along the middle of the
    gap and fading towards the floor above and below. The mesh repeats across
    the tile's width, so neighbouring fizzlers join.
  -->
  <defs>
    <!-- The field's strength: full along the middle, fading above and below -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="256">
      <stop offset="0" stop-color="rgb(255, 255, 255)" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="rgb(255, 255, 255)" stop-opacity="1"/>
      <stop offset="1" stop-color="rgb(255, 255, 255)" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="field" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect x="0" y="0" width="256" height="256" fill="url(#fade)"/>
    </mask>
    <filter id="glow" x="-0.1" y="-0.1" width="1.2" height="1.2" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256"/>
    </clipPath>
  </defs>

  <g mask="url(#field)" clip-path="url(#tile)">
    <rect x="0" y="0" width="256" height="256" fill="rgb(210, 196, 248)" opacity="0.28"/>
