<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A fizzler that is on (docs/sprites.md): the steel-blue
    see-through field and its bright edge lines, filled with many fine
    sparkle dots and a few brighter ones, each in a soft glow. No lines
    cross the field. Drawn for a gap in a wall running left to right.
  -->
  <defs>
    <!-- The soft light around the edge lines and the particles -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="haze" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- The field -->
    <rect x="0" y="0" width="256" height="256" fill="rgb(48, 76, 140)" opacity="0.62"/>

    <!-- Fine sparkle dots: many small ones, a few brighter, each over a soft glow of itself -->
    <use href="#dots" filter="url(#glow)" opacity="0.8"/>
