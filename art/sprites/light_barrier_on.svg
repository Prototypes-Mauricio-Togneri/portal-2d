<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A light barrier that is on (docs/sprites.md): a band of pale teal hard
    light 96 px wide, running left to right through the tile's middle and
    touching both side edges, so neighbouring light barriers make one band.
    See-through, so the floor shows faintly, with a faint honeycomb and
    bright edges, so it reads as a surface of light rather than a ray. The
    game turns it a quarter for a vertical light barrier; the honeycomb
    repeats every 32 px along the band, so it joins across tiles.
  -->
  <defs>
    <!-- The honeycomb, one cell 32 px wide, its rows starting on the band's top edge -->
    <pattern id="honeycomb" patternUnits="userSpaceOnUse" x="0" y="80" width="32" height="55.4256">
      <path d="M0,9.2376 L16,0 L32,9.2376 M0,9.2376 V27.7128 M32,9.2376 V27.7128 M0,27.7128 L16,36.9504 L32,27.7128 M16,36.9504 V55.4256" fill="none" stroke="rgb(186, 246, 228)" stroke-width="2"/>
    </pattern>

    <!-- The light along both edges, fading inwards -->
    <linearGradient id="edges" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="176">
      <stop offset="0" stop-color="rgb(186, 246, 228)" stop-opacity="0.95"/>
      <stop offset="0.2" stop-color="rgb(186, 246, 228)" stop-opacity="0"/>
      <stop offset="0.8" stop-color="rgb(186, 246, 228)" stop-opacity="0"/>
      <stop offset="1" stop-color="rgb(186, 246, 228)" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- A deep teal rim just outside the band, so it reads on the light floor -->
  <rect x="0" y="78" width="256" height="100" fill="rgb(20, 150, 120)" opacity="0.5"/>

  <!-- The band -->
  <rect x="0" y="80" width="256" height="96" fill="rgb(96, 222, 186)" opacity="0.64"/>
  <rect x="0" y="80" width="256" height="96" fill="url(#honeycomb)" opacity="0.6"/>
  <rect x="0" y="80" width="256" height="96" fill="url(#edges)"/>

  <!-- Its two bright edges -->
  <rect x="0" y="80" width="256" height="3" fill="rgb(242, 255, 251)"/>
  <rect x="0" y="173" width="256" height="3" fill="rgb(242, 255, 251)"/>
</svg>
