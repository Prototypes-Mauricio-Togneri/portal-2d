<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A light barrier that is on (docs/sprites.md): a field of pale teal hard
    light filling the tile between its emitters, see-through so the floor
    shows faintly, crossed by fine bright scan lines and brightest along the
    emitters it leaves from. The emitters are light_barrier_off's exactly,
    their slots lit teal.
  -->
  <defs>
    <!-- The field's scan lines, one every 12 px -->
    <pattern id="scanLines" patternUnits="userSpaceOnUse" x="0" y="2" width="256" height="12">
      <rect x="0" y="0" width="256" height="3" fill="rgb(232, 255, 246)"/>
    </pattern>

    <!-- The light thrown in from the emitters, soft-edged -->
    <filter id="rimGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="field">
      <rect x="24" y="24" width="208" height="208"/>
    </clipPath>

    <!-- The two slots along the top side; the other sides are this turned -->
    <g id="slots" fill="rgb(96, 222, 186)">
      <rect x="40" y="14.5" width="76" height="6" rx="2"/>
      <rect x="140" y="14.5" width="76" height="6" rx="2"/>
    </g>
  </defs>

  <!-- The field -->
  <g clip-path="url(#field)">
    <rect x="24" y="24" width="208" height="208" fill="rgb(96, 222, 186)" opacity="0.72"/>
    <rect x="24" y="24" width="208" height="208" fill="url(#scanLines)" opacity="0.55"/>
    <rect x="28" y="28" width="200" height="200" fill="none" stroke="rgb(200, 255, 236)" stroke-width="14" filter="url(#rimGlow)"/>
    <rect x="26.5" y="26.5" width="203" height="203" fill="none" stroke="rgb(214, 255, 240)" stroke-width="3"/>
  </g>

  <!-- The emitter frame -->
  <path d="M16,10 H240 A6,6 0 0 1 246,16 V240 A6,6 0 0 1 240,246 H16 A6,6 0 0 1 10,240 V16 A6,6 0 0 1 16,10 Z M28,25 A3,3 0 0 0 25,28 V228 A3,3 0 0 0 28,231 H228 A3,3 0 0 0 231,228 V28 A3,3 0 0 0 228,25 Z" fill="rgb(50, 55, 61)" fill-rule="evenodd" stroke="rgb(176, 183, 189)" stroke-width="2.5"/>

  <!-- The slots, lit -->
  <use xlink:href="#slots"/>
  <use xlink:href="#slots" transform="rotate(90 128 128)"/>
  <use xlink:href="#slots" transform="rotate(180 128 128)"/>
  <use xlink:href="#slots" transform="rotate(270 128 128)"/>
</svg>
