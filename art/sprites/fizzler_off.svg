<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A fizzler that is off (docs/sprites.md), drawn for a gap in a wall
    running left to right: the field gone, only a faint steel-blue trace
    with its dim edge lines and waves, so the gap still shows something
    there. The game turns it when the gap runs the other way.
  -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- The faint trace of the field -->
    <rect x="0" y="0" width="256" height="256" fill="rgb(48, 76, 140)" opacity="0.12"/>

    <!-- Its waves, unlit -->
    <g fill="none" stroke="rgb(110, 124, 150)" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <path d="M 0 78 q 64 -36 128 0 t 128 0"/>
      <path d="M 0 178 q 64 36 128 0 t 128 0"/>
    </g>

    <!-- Its edge lines along the floor, unlit -->
    <g fill="rgb(110, 124, 150)" opacity="0.5">
      <rect x="0" y="4" width="256" height="4"/>
      <rect x="0" y="248" width="256" height="4"/>
    </g>
  </g>
</svg>
