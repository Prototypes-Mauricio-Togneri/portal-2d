<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A fizzler that is off (docs/sprites.md): the field gone,
    only a faint steel-blue trace, its dim edge lines and a few grey dots.
  -->
  <defs>
    <!-- The soft light around the edge lines and the particles -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="haze" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <clipPath id="tile">
      <rect x="0" y="0" width="256" height="256"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- The faint trace of the field -->
    <rect x="0" y="0" width="256" height="256" fill="rgb(48, 76, 140)" opacity="0.12"/>

    <!-- A few of its dots, unlit -->
    <g>
      <circle cx="173.7" cy="62.1" r="3.7" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="91.1" cy="159.7" r="3.6" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="168.7" cy="74.4" r="3.8" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="229.1" cy="88.2" r="3.7" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="72.9" cy="205.4" r="3.6" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="50.4" cy="168.6" r="4.4" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="60.8" cy="149.9" r="3.4" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="78.1" cy="100.9" r="4.2" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="226.7" cy="120.6" r="4.3" fill="rgb(140, 150, 170)" opacity="0.3"/>
      <circle cx="113.9" cy="154.2" r="4.1" fill="rgb(140, 150, 170)" opacity="0.3"/>
    </g>

    <!-- Its edge lines along the floor, unlit -->
    <g fill="rgb(110, 124, 150)" opacity="0.5">
      <rect x="0" y="4" width="256" height="4"/>
      <rect x="0" y="248" width="256" height="4"/>
    </g>
  </g>
</svg>
