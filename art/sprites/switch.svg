<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A switch (docs/sprites.md): a squat round steel post with a
    solid yellow top, nothing else. Its one bright colour makes it the thing
    to use in a chamber of greys.
  -->
  <defs>
    <!-- The post's rim: darker at its outer edge -->
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="76">
      <stop offset="0.8" stop-color="rgb(104, 108, 115)"/>
      <stop offset="1" stop-color="rgb(66, 69, 75)"/>
    </radialGradient>

    <!-- The cap: yellow, lit in its middle, deeper at its edge -->
    <radialGradient id="cap" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="60">
      <stop offset="0.5" stop-color="rgb(250, 208, 70)"/>
      <stop offset="1" stop-color="rgb(222, 172, 28)"/>
    </radialGradient>
  </defs>

  <!-- The post, its outline and lit lip -->
  <circle cx="128" cy="128" r="78" fill="rgb(34, 36, 40)"/>
  <circle cx="128" cy="128" r="75" fill="url(#rim)"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="rgb(140, 144, 151)" stroke-width="2"/>

  <!-- The cap -->
  <circle cx="128" cy="128" r="62" fill="rgb(120, 92, 16)"/>
  <circle cx="128" cy="128" r="59" fill="url(#cap)"/>
</svg>
