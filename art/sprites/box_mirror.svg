<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A mirror box (docs/sprites.md): the box (box.svg), a plated cube seen
    from above, with a mirror of glass from corner to corner, bottom left to
    top right, in place of its disc: a dark frame, the glass, lit across its
    width, and a white glint along it. The game draws it as "/" and turns it
    a quarter turn for "\". Drawn 184 px across, the outline included, then
    scaled to 80 % round the tile's middle, so about 147 px. One quarter (a
    tab, its bar and the corner block to its left) is drawn and turned.
  -->
  <defs>
    <!-- The dark core, under the blocks and tabs -->
    <rect id="core" x="44.8" y="44.8" width="166.4" height="166.4"/>

    <!-- The top tab, flush with the box's edge -->
    <rect id="tab" x="111.7" y="41" width="32.6" height="24.8" rx="1.4"/>

    <!-- The top-left corner block, its inner corner cut off -->
    <path id="block" d="M 42.4,41 H 96 A 1.4,1.4 0 0 1 97.4,42.4 V 69.4 A 3.4,3.4 0 0 1 96.4,71.8 L 71.8,96.4 A 3.4,3.4 0 0 1 69.4,97.4 H 42.4 A 1.4,1.4 0 0 1 41,96 V 42.4 A 1.4,1.4 0 0 1 42.4,41 Z"/>

    <!-- One quarter's share of the outer shape -->
    <g id="quarter-outline">
      <use href="#tab"/>
      <use href="#block"/>
    </g>

    <!-- One quarter: the bar runs under the tab -->
    <g id="quarter">
      <rect x="120.3" y="65" width="15.4" height="33" fill="rgb(98, 97, 98)"/>
      <use href="#tab" fill="rgb(168, 167, 167)"/>
      <use href="#block" fill="rgb(201, 198, 199)"/>
    </g>

    <!-- The glass, lit across its width -->
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="0" y1="119" x2="0" y2="137">
      <stop offset="0" stop-color="rgb(150, 158, 170)"/>
      <stop offset="0.45" stop-color="rgb(238, 242, 248)"/>
      <stop offset="1" stop-color="rgb(176, 184, 196)"/>
    </linearGradient>
  </defs>

  <!-- The whole box, scaled to 80 % round the tile's middle -->
  <g transform="translate(128 128) scale(0.8) translate(-128 -128)">
    <!-- The outline: the outer shape stroked under everything, so only its outer half shows -->
    <g fill="rgb(44, 48, 54)" stroke="rgb(44, 48, 54)" stroke-width="10" stroke-linejoin="round">
      <use href="#core"/>
      <use href="#quarter-outline"/>
      <use href="#quarter-outline" transform="rotate(90 128 128)"/>
      <use href="#quarter-outline" transform="rotate(180 128 128)"/>
      <use href="#quarter-outline" transform="rotate(270 128 128)"/>
    </g>

    <!-- The core -->
    <use href="#core" fill="rgb(83, 83, 84)"/>

    <!-- Four quarters -->
    <use href="#quarter"/>
    <use href="#quarter" transform="rotate(90 128 128)"/>
    <use href="#quarter" transform="rotate(180 128 128)"/>
    <use href="#quarter" transform="rotate(270 128 128)"/>

    <!-- The mirror, from corner to corner, a "/": its dark frame, the glass, a white glint along it -->
    <g transform="rotate(-45 128 128)">
      <rect x="52" y="115" width="152" height="26" rx="5" fill="rgb(44, 48, 54)"/>
      <rect x="56" y="119" width="144" height="18" rx="3" fill="url(#glass)"/>
      <rect x="60" y="125.5" width="136" height="3" rx="1.5" fill="rgb(255, 255, 255)" opacity="0.9"/>
    </g>
  </g>
</svg>
