<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A light barrier that is off (docs/sprites.md): only its emitters stay, a
    thin dark steel frame along the tile's four edges, kept just inside them,
    with two dark slots on each side, clear of the middle line, where the
    field of light leaves from. It must match light_barrier_on but for the
    field and the lit slots.
  -->
  <defs>
    <!-- The two slots along the top side; the other sides are this turned -->
    <g id="slots" fill="rgb(28, 72, 66)">
      <rect x="40" y="14.5" width="76" height="6" rx="2"/>
      <rect x="140" y="14.5" width="76" height="6" rx="2"/>
    </g>
  </defs>

  <!-- The emitter frame -->
  <path d="M16,10 H240 A6,6 0 0 1 246,16 V240 A6,6 0 0 1 240,246 H16 A6,6 0 0 1 10,240 V16 A6,6 0 0 1 16,10 Z M28,25 A3,3 0 0 0 25,28 V228 A3,3 0 0 0 28,231 H228 A3,3 0 0 0 231,228 V28 A3,3 0 0 0 228,25 Z" fill="rgb(50, 55, 61)" fill-rule="evenodd" stroke="rgb(176, 183, 189)" stroke-width="2.5"/>

  <!-- The slots -->
  <use xlink:href="#slots"/>
  <use xlink:href="#slots" transform="rotate(90 128 128)"/>
  <use xlink:href="#slots" transform="rotate(180 128 128)"/>
  <use xlink:href="#slots" transform="rotate(270 128 128)"/>
</svg>
