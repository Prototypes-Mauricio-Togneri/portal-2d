<svg xmlns="http://www.w3.org/2000/svg" width="384" height="384" viewBox="0 0 384 384">
  <!--
    The orange portal (docs/sprites.md), drawn on the top edge of its wall
    tile, opening up onto the tile above; the game turns it to the side of the
    wall it opens on. Its tile is the centred 256 px square, the margin around
    it left for the halo to spill onto the floor. A flat oval sitting on the
    wall's 48 px slope, from just inside the tile's edge to the slope's lit
    lip, and short enough to stay clear of the diagonals where two slopes meet
    at a wall's end: a deep swirling inside, a bright rim with a lit inner
    edge, and a soft halo just outside the rim.
  -->
  <defs>
    <!-- The inside: deep in the middle, brighter towards the rim -->
    <radialGradient id="depth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgb(110, 55, 8)"/>
      <stop offset="0.7" stop-color="rgb(220, 130, 25)"/>
      <stop offset="1" stop-color="rgb(255, 160, 30)"/>
    </radialGradient>

    <!-- The halo's softness -->
    <filter id="halo" x="-0.2" y="-1" width="1.4" height="3" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.95"/>
    </filter>
  </defs>

  <!-- Halo -->
  <ellipse cx="192" cy="87.5" rx="97.25" ry="19.75" fill="none" stroke="rgb(255, 160, 30)" stroke-width="5.2" opacity="0.7" filter="url(#halo)"/>

  <!-- Inside -->
  <ellipse cx="192" cy="87.5" rx="97.25" ry="19.75" fill="url(#depth)"/>

  <!-- Swirl -->
  <g fill="none" stroke="rgb(255, 210, 150)" stroke-width="2.1" stroke-linecap="round" opacity="0.35">
    <path d="M 125.52 82.62 A 70.73 14.26 0 0 1 258.48 82.62"/>
    <path d="M 237.71 90.68 A 48.62 9.33 0 0 1 146.29 90.68"/>
    <path d="M 171.67 84.32 A 26.52 4.94 0 0 1 214.99 89.97"/>
  </g>

  <!-- Rim, then its lit inner edge -->
  <ellipse cx="192" cy="87.5" rx="97.25" ry="19.75" fill="none" stroke="rgb(255, 160, 30)" stroke-width="5.5"/>
  <ellipse cx="192" cy="87.5" rx="93.5" ry="16" fill="none" stroke="rgb(255, 220, 160)" stroke-width="1.5"/>
</svg>
