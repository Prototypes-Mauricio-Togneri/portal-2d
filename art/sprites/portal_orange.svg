<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    The orange portal (docs/sprites.md), drawn on the top edge of its wall tile,
    opening up onto the tile above; the game turns it to the side of the wall
    it opens on. A flat oval: a deep swirling inside, a bright rim with a lit
    inner edge, and a soft halo just outside the rim, all inside the tile.
  -->
  <defs>
    <!-- The inside: deep in the middle, brighter towards the rim -->
    <radialGradient id="depth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgb(110, 55, 8)"/>
      <stop offset="0.7" stop-color="rgb(220, 130, 25)"/>
      <stop offset="1" stop-color="rgb(255, 160, 30)"/>
    </radialGradient>

    <!-- The halo's softness -->
    <filter id="halo" x="-0.2" y="-0.5" width="1.4" height="2" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Halo -->
  <ellipse cx="128" cy="48" rx="110" ry="36" fill="none" stroke="rgb(255, 160, 30)" stroke-width="8" opacity="0.7" filter="url(#halo)"/>

  <!-- Inside -->
  <ellipse cx="128" cy="48" rx="110" ry="36" fill="url(#depth)"/>

  <!-- Swirl -->
  <g fill="none" stroke="rgb(255, 210, 150)" stroke-width="3" stroke-linecap="round" opacity="0.35">
    <path d="M 52.8 39.1 A 80 26 0 0 1 203.2 39.1"/>
    <path d="M 179.7 53.8 A 55 17 0 0 1 76.3 53.8"/>
    <path d="M 105 42.2 A 30 9 0 0 1 154 52.5"/>
  </g>

  <!-- Rim, then its lit inner edge -->
  <ellipse cx="128" cy="48" rx="110" ry="36" fill="none" stroke="rgb(255, 160, 30)" stroke-width="9"/>
  <ellipse cx="128" cy="48" rx="104.5" ry="30.5" fill="none" stroke="rgb(255, 220, 160)" stroke-width="2"/>
</svg>
