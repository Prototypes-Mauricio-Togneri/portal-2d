<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A floor arrow (docs/sprites.md), a sharp chevron painted flat on the
    floor with square ends and a pointed corner, centred on the tile,
