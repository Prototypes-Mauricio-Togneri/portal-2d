<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    A box (docs/sprites.md), a ring-framed cube: a chunky light cube seen from
    above, split along its diagonals into four quarter blocks by dark gaps,
    with a dark slate ring round a big light centre disc. One quarter is
    drawn and turned.
  -->
  <defs>
    <!-- The top quarter block: a trapezoid between the diagonals, bevel round a lighter face -->
    <g id="quarter">
      <polygon points="48,44 208,44 128,124" fill="rgb(188, 190, 188)" stroke="rgb(44, 48, 54)" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="62,52 194,52 128,118" fill="rgb(230, 230, 226)"/>
      <polygon points="62,52 194,52 191,55 65,55" fill="rgb(246, 246, 242)"/>
    </g>

    <!-- The centre: a dark collar round a light disc with a groove and a pale lit rim -->
    <g id="centre">
      <circle cx="128" cy="128" r="52" fill="rgb(44, 48, 54)"/>
      <circle cx="128" cy="128" r="49" fill="rgb(66, 71, 79)"/>
      <circle cx="128" cy="128" r="44" fill="rgb(230, 230, 226)"/>
      <circle cx="128" cy="128" r="27" fill="none" stroke="rgb(196, 198, 196)" stroke-width="3"/>
      <circle cx="128" cy="128" r="42" fill="none" stroke="rgb(255, 255, 255)" stroke-width="2" opacity="0.8"/>
    </g>
  </defs>

  <!-- The dark slate frame, recessed, with its outline -->
  <rect x="38" y="38" width="180" height="180" rx="16" fill="rgb(44, 48, 54)"/>
  <rect x="42" y="42" width="172" height="172" rx="13" fill="rgb(90, 96, 104)"/>

  <!-- Four quarter blocks, the dark frame showing between them along the diagonals -->
  <use href="#quarter"/>
  <use href="#quarter" transform="rotate(90 128 128)"/>
  <use href="#quarter" transform="rotate(180 128 128)"/>
  <use href="#quarter" transform="rotate(270 128 128)"/>

  <!-- The ring: a slate band round the centre -->
  <circle cx="128" cy="128" r="66" fill="rgb(44, 48, 54)"/>
  <circle cx="128" cy="128" r="62" fill="rgb(90, 96, 104)"/>

  <!-- The centre -->
  <use href="#centre"/>
</svg>
