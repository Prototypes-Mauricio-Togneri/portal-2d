<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Portal 2D</title>

  <link type="text/css" rel="stylesheet" href="css/styles.css" />

  <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>

  <script type="text/javascript" src="js/arrow.js"></script>
  <script type="text/javascript" src="js/barrier.js"></script>
  <script type="text/javascript" src="js/box.js"></script>
  <script type="text/javascript" src="js/button.js"></script>
  <script type="text/javascript" src="js/chamber.js"></script>
  <script type="text/javascript" src="js/ditch.js"></script>
  <script type="text/javascript" src="js/door.js"></script>
  <script type="text/javascript" src="js/exit.js"></script>
  <script type="text/javascript" src="js/fizzler.js"></script>
  <script type="text/javascript" src="js/floor.js"></script>
  <script type="text/javascript" src="js/gateway.js"></script>
  <script type="text/javascript" src="js/input.js"></script>
  <script type="text/javascript" src="js/laser.js"></script>
  <script type="text/javascript" src="js/level.js"></script>
  <script type="text/javascript" src="js/music.js"></script>
  <script type="text/javascript" src="js/portal.js"></script>
  <script type="text/javascript" src="js/renderer.js"></script>
  <script type="text/javascript" src="js/sound.js"></script>
  <script type="text/javascript" src="js/state.js"></script>
  <script type="text/javascript" src="js/subject.js"></script>
  <script type="text/javascript" src="js/switch.js"></script>
  <script type="text/javascript" src="js/wall.js"></script>

  <script>

    var level = null;

    $(document).ready(function () {
      var width = $(document).width();
      var height = $(document).height() - 100; // remove top and bottom margin of 50px
      var container = document.getElementById('container');

      level = new Level(width, height, container);
    })

    function chamberSelected(chamber, option) {
      option.blur();
      music.play();

      loadChamber(chamber);
    }

    function loadChamber(chamber) {
      $.getJSON('./chambers/' + chamber, function (result) {
        level.load(result);
      });
    }

  </script>

</head>

<body>

  <div id="container"></div>

  <div class="help-container">

    <table cellpadding="5">
      <tr class="help-item">
        <td>ARROWS</td>
        <td class="help-description">MOVE</td>
      </tr>
      <tr class="help-item">
        <td>A</td>
        <td class="help-description"><span style="color:#288CDC">PORTAL</span></td>
      </tr>
      <tr class="help-item">
        <td>D</td>
        <td class="help-description"><span style="color:#FFA01E">PORTAL</span></td>
      </tr>
      <tr class="help-item">
        <td>SPACE</td>
        <td class="help-description">INTERACT</td>
      </tr>
    </table>

  </div>

  <div class="list-container">

    <select onchange="chamberSelected(this.value, this)">
      <option class="list-item" value="" selected disabled></option>
      <option class="list-item" value="chamber1.json">Chamber 1</option>
      <option class="list-item" value="chamber2.json">Chamber 2</option>
      <option class="list-item" value="chamber3.json">Chamber 3</option>
    </select>

  </div>

</body>

</html>
